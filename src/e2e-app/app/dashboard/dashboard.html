<div
  class="record"
  [attr.data-qbc-emissions]="emissions()"
  [attr.data-qbc-last-layout]="lastLayout()"
></div>

<div class="controls">
  <button type="button" data-qbc-mode-toggle (click)="toggleMode()">
    {{ mode() === 'edit' ? 'Leave edit mode' : 'Enter edit mode' }}
  </button>
  <button type="button" data-qbc-add-tile (click)="onAddTile()">Add tile</button>
  <button type="button" data-qbc-mutate-layout (click)="mutateLastLayout()">
    Mutate last layout
  </button>
</div>

<qbc-grid
  [layout]="layout()"
  [columns]="columns"
  [rowHeight]="rowHeight"
  [gap]="gap"
  [mode]="mode()"
  (layoutChange)="onLayoutChange($event)"
>
  <div *qbcGridTile="let tile" class="widget">
    <span class="widget__label">{{ tile.label ?? tile.id }}</span>
    <button type="button" data-qbc-lock-toggle (click)="toggleLock(tile.id)">
      {{ tile.locked ? 'Unlock' : 'Lock' }}
    </button>
    <button type="button" data-qbc-remove-tile (click)="onRemoveTile(tile.id)">Remove</button>
  </div>
</qbc-grid>
