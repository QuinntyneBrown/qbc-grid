@if (overlayVisible()) {
  <div class="qbc-grid__overlay" data-qbc-overlay aria-hidden="true"></div>
}

@if (shadow(); as preview) {
  <div
    class="qbc-grid__shadow"
    data-qbc-shadow
    aria-hidden="true"
    [attr.data-valid]="preview.valid"
    [style.--qbc-tile-x]="preview.cell.x"
    [style.--qbc-tile-y]="preview.cell.y"
    [style.--qbc-tile-cols]="preview.cell.cols"
    [style.--qbc-tile-rows]="preview.cell.rows"
  ></div>
}

@for (tile of orderedTiles(); track tile.id) {
  <div
    class="qbc-grid__tile"
    [attr.data-qbc-tile]="tile.id"
    [attr.data-locked]="tile.locked ? '' : null"
    [attr.tabindex]="tabIndexOf(tile)"
    [style.--qbc-tile-x]="tile.x"
    [style.--qbc-tile-y]="tile.y"
    [style.--qbc-tile-cols]="tile.cols"
    [style.--qbc-tile-rows]="tile.rows"
    (pointerdown)="onPointerDown(tile, $event)"
  >
    <ng-container
      [ngTemplateOutlet]="tileTemplate()?.templateRef ?? null"
      [ngTemplateOutletContext]="{ $implicit: tile }"
    />
    @if (isInteractive(tile)) {
      <span
        class="qbc-grid__handle"
        data-qbc-handle
        aria-hidden="true"
        (pointerdown)="onHandlePointerDown(tile, $event)"
      ></span>
    }
  </div>
}
