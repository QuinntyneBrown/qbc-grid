name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The prover runs first. A rule that cannot fire reports success forever.
      - run: python docs/tools/prove_gapcheck.py
      - run: python docs/tools/gapcheck.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:tokens
      # L2-033 is proved by symptom: a bundled Angular gives the consumer a second runtime
      # and an injector error, and a service injected from outside gives a null-injector
      # failure. The workspace route cannot see either, because a path mapping resolves the
      # library from source and shares the workspace's own Angular.
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:consumer

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global npm@11
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: acceptance-report
          path: blob-report/
          retention-days: 7
